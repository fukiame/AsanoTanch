pm_start_text: |
  hi {}, I'm [{}](https://raw.githubusercontent.com/fukiame/AsanoTanch/origin/assets/ic_product_origin_at_cropped.png),
  I am a modular group management bot with some fun extras ;)
  I can do a variety of things, and help u manage your group efficiently!

  All commands can be accessed by using: / ! or >
  *Click on help to learn more!*

grp_start_text: "hey, I'm {}."

pm_help_text: |
  hi there!
  i'm a group management bot!
  heres some of the things I can help you with.
  *main* commands available:
  • /start: Starts me, can be used to check I'm alive or not.
  • /help: PM's you this message.
  • /settings:
  - in PM: will send you your settings for all supported modules.
  - in a group: will redirect you to pm, with all that chat's settings.
  Click on the buttons below to get documentation about specific modules!

add_bot_to_group_btn: "add me!"
reommended_fed_btn: "recommended federation"
support_chat_link_btn: "support"
updates_channel_link_btn: "updates"
src_btn: "source code"

admin_help: |
  - `/admins`,`/adminlist`,`/staff`*:* list of admins in the chat

  *admins only:*
  - `/invitelink`*:* gets invitelink

  - `/promote`*:* promotes the user replied to
  - `/fullpromote`*:* promotes the user replied to with full permissions
  - `/demote`*:* demotes the user replied to
  - `/admincache`*:* refreshes the admins cache
  - `/setanon <user_id/mention>`*:* makes the user anonymous (if no user given, set the sender)
  - `/unsetanon <user_id/mention>`*:* makes the user non anonymous (if no user given, set the sender)
  - `/title <title here>`*:* sets a custom title for an admin that the bot promoted

  - `/zombies`*:* removes deleted accounts from the group

  - `/import`*:* reply to a backup file to import as much as possible. note that files/photos can't be imported due to telegram restrictions.
  - `/export`*:* export group data: rules, notes (documents, images, music, video, audio, voice, text, text buttons)

  - `/setgpic`*:* sets the replied image/document as the group picture
  - `/delgpic`*:* deletes the group picture 
  - `/setgtitle`*:* sets the group title
  - `/setgdesc`*:* sets the group description
  - `/setgsticker`*:* sets the group sticker pack
  - `/setgstickers`*:* sets the group sticker pack

  - `/requests <on-off/yes-no/true-false>`*:* toggle the approve/decline join request menu

afk_help: |
  - /afk <reason>: mark yourself as AFK(away from keyboard).
  - brb <reason>: same as the afk command - but not a command.
  when marked as AFK, any mentions will be replied to with a message to say you're not available!

anilist_help: |
  *AniList*
  Get information about anime, manga or characters with the help of this module! All data is fetched from [AniList](anilist.co).
  *Available commands:*
  - /anime <anime>: returns information about the anime.
  - /character <character>: returns information about the character.
  - /manga <manga>: returns information about the manga.

antiflood_help: |
  Antiflood allows you to act on users that send more than x messages in a row. exceeding the set flood thresh will restrict that user.
  - `/flood`*:* get current flood control settings
  *admins only:*
  - `/setflood <int/'no'/'off'>`*:* enables or disables flood control
  *example:* `/setflood 10`
  - `/setfloodmode <ban/kick/mute/tban/tmute> <value>`*:* Action to perform when user have exceeded flood limit. ban/kick/mute/tmute/tban
  * *note:* value must be filled for tban and tmute!!
   it can be, for example:
   `5m` = 5 minutes
   `6h` = 6 hours
   `3d` = 3 days
   `1w` = 1 week

approve_help: |
  Sometimes, you might trust a user not to send unwanted content.
  Maybe not enough to make them admin, but you might be ok with locks, blacklists, and antiflood not applying to them.
  That's what approvals are for.
  *admin commands:*
  - `/approval`*:* check a user's approval status in current chat.
  - `/approve`*:* approve of a user.
  - `/unapprove`*:* unapprove of a user.
  - `/approved`*:* list all approved users.
  - `/unapproveall`*:* unapprove *all* users in a chat. this cannot be undone.

bans_help: |
  - /kickme: kicks the user who issued the command

  *admin only:*
  - /ban <userhandle>: bans a user. (via handle, or reply)
  - /sban <userhandle>: bans a user silently.
  - /dban <userhandle>: bans a user, also deletes the message replied to.
  - /dsban <userhandle>: bans a user, also deletes the sent and replied to message.
  - /tban <userhandle> x(m/h/d): bans a user for x time. (via handle, or reply). m = minutes, h = hours, d = days.
  - /unban <userhandle>: unbans a user. (via handle, or reply)
  - /kick <userhandle>: kick a user out of the group, (via handle, or reply)
  - /dkick <userhandle>: kick a user out of the group, silently.
  - /skick <userhandle>: kick a user out of the group, also deletes the replied to message.
  - /dskick <userhandle>: kick a user out of the group also deletes the sent and replied to message.

blacklist_help: |
  Blacklists stops certain triggers from being said in a group. any time the trigger is mentioned, the message will immediately be (by default) deleted.

  *NOTE*: Blacklists do not affect group admins.

  - `/blacklist`(s) or `/blocklist`(s)*:* View the current blacklisted words.

  admin only:
  - `/addblacklist <triggers> {optional action}`*:* add a trigger to the blacklist. each line is considered one trigger, so using different lines will allow you to add multiple triggers.
  - `/addblocklist <triggers> {optional action}`*:* same as addblacklist
  - `/unblacklist <triggers>`*:* remove triggers from the blacklist. same newline logic applies here, so you can remove multiple triggers at once.
  - `/unblocklist <triggers>`*:* same as unblacklist
  - `/blacklistmode <off/del/warn/ban/kick/mute/tban/tmute>`*:* action to perform when someone sends blacklisted words.
  - `/blocklistmode <off/del/warn/ban/kick/mute/tban/tmute>`*:* same as blacklistmode

  owner only:
  - `/removeallblacklists`, `/removeallblocklists`*:* removes all blacklists from the chat.

  *note:* you can set custom actions for each blacklist.
  the possible actions are:
  `default` - `delete` - `warn` - `mute` - `kick` - `ban`

cleaner_help: |
  *bluetext cleaner:*
  - /cleanbluetext <on/off/yes/no> - clean commands after sending
  - /ignorecleanbluetext <word> - prevent auto cleaning of the command
  - /unignorecleanbluetext <word> - remove prevent auto cleaning of the command
  - /listcleanbluetext - list currently whitelisted commands

  *clear cmd:*
  - /clearcmd: provides all commands that has been set in current group with their deletion time
  - /clearcmd list: list all available commands for this module
  - /clearcmd <command>: get the deletion time for a specific `<command>`

  *set module configuration:*
  - /clearcmd <command> <time>: set a deletion `<time>` for a specific `<command>` in current group. all outputs of that command will be deleted in that group after time value in seconds. time can be set between 5 and 300 seconds

  *restore module configuration:*
  - /clearcmd restore: the deletion time set for ALL commands will be removed in current group
  - /clearcmd <command> restore: the deletion time set for a specific `<command>` will be removed in current group

connections_help: |
  - /connect: connect to a chat (can be done in a group by /connect or /connect <chat id> in PM)
  - /connection: list connected chats
  - /disconnect: disconnect from a chat
  - /helpconnect: list available commands that can be done remotely

  *admin only:*
  - /allowconnect <yes/no>: allow a user to connect to a chat

cust_filters_help: |
  • `/filters`*:* list all active filters saved in the chat.

  *admin only:*
  • `/filter <keyword> <reply message>`*:* add a filter to this chat. the bot will now reply that message whenever 'keyword'
  is mentioned. if you reply to a sticker with a keyword, the bot will reply with that sticker. note that all filter
  keywords are in lowercase. if you want your keyword to be a sentence, use quotes. eg: /filter "hey there" how you
  doin?
  • `/stop <filter keyword>`*:* stop that filter.

  *chat creator only:*
  • `/removeallfilters`*:* remove all chat filters at once.
  • `/stopall`*:* remove all chat filters at once.

  *note*: filters also support markdown formatters like: {first}, {last} etc.. and buttons.
  check `/markdownhelp` to know more!

disable_help: |
  this allows you to disable some commonly used commands, so no-one can use them.
  it'll also allow you to autodelete them, stopping people from bluetexting.

  • /cmds: Check the current status of disabled commands

  *admin only:*
  • /enable <cmd name>: Enable that command
  • /disable <cmd name>: Disable that command
  • /listcmds: List all possible disablable commands

feds_help: |
  with federation, you can make a ban in one chat overlap with all other chats.

  *click on the buttons below to learn in depth about all the commands.*

FED_OWNER_HELP: | 
  *fed owner only:*
  • `/newfed <fed_name>`*:* creates a federation, one allowed per user
  • `/renamefed <fed_id> <new_fed_name>`*:* renames the fed id to a new name
  • `/delfed <fed_id>`*:* delete a federation, and any information related to it. will not cancel blocked users
  • `/fpromote <user>`*:* assigns the user as a federation admin. enables all commands for the user under `fed admins`
  • `/fdemote <user>`*:* drops the user from the admin federation to a normal user
  • `/subfed <fed_id>`*:* subscribes to a given fed id, bans from that subscribed fed will also happen in your fed
  • `/unsubfed <fed_id>`*:* unsubscribes to a given fed id
  • `/setfedlog <fed_id>`*:* sets the group as a fed log report base for the federation
  • `/unsetfedlog <fed_id>`*:* removed the group as a fed log report base for the federation
  • `/fbroadcast <message>`*:* broadcasts a messages to all groups that have joined your fed
  • `/fedsubs`*:* shows the feds your group is subscribed to `(broken rn)`

FED_ADMIN_HELP: |
  *fed admins:*
  • `/fban <user> <reason>`*:* fed bans a user
  • `/unfban <user> <reason>`*:* removes a user from a fed ban
  • `/fedinfo <fed_id>`*:* information about the specified federation
  • `/joinfed <fed_id>`*:* join the current chat to the federation. only chat owners can do this. every chat can only be in one federation
  • `/leavefed <fed_id>`*:* leave the federation given. only chat owners can do this
  • `/setfrules <rules>`*:* arrange federation rules
  • `/fedadmins`*:* show federation admin
  • `/fbanlist`*:* displays all users who are victimized at the federation at this time
  • `/fedchats`*:* get all the chats that are connected in the federation
  • `/chatfed `*:* see the federation in the current chat

FED_USER_HELP: | 
  *any user:*
  • `/fbanstat`*:* shows if you/or the user you are replying to or their username is fbanned somewhere or not
  • `/fednotif <on/off>`*:* federation settings not in pm when there are users who are fbaned/unfbanned
  • `/frules`*:* see federation regulations

formt_help_bse: |
  I support large number of formatting options to make your messages more expressive. Take a look!

md_help: |
  <b>Markdown Formatting</b>
  You can format your message using *bold*, _italics_, -underline-, and much more.
  <b>Supported markdown</b>:
  - <code>`code words`</code>: Backticks are used for monospace fonts. Shows as: <code>code words</code>.
  - <code>_italic words_</code>: Underscores are used for italic fonts. Shows as: <i>italic words</i>.
  - <code>*bold words*</code>: Asterisks are used for bold fonts. Shows as: <b>bold words</b>.
  - <code>~strikethrough~</code>: Tildes are used for strikethrough. Shows as: <strike>strikethrough</strike>.
  - <code>__underline__</code>: Double underscores are used for underline. Shows as: <u>underline</u>.
  - <code>||spoiler||</code>: Double vertical lines are used for spoilers. Shows as: <tg-spoiler>spoiler</tg-spoiler>.
  - <code>[hyperlink](example.com)</code>: This is the formatting used for hyperlinks. Shows as: <a href="https://example.com/">hyperlink</a>.
  - <code>[My Button](buttonurl://example.com)</code>: This is the formatting used for creating buttons. This example will create a button named "My button" which opens <code>example.com</code> when clicked.
  If you would like to send buttons on the same row, use the <code>:same</code> formatting.
  <b>Example:</b>
  <code>[button 1](buttonurl://example.com)</code>
  <code>[button 2](buttonurl://example.com:same)</code>
  <code>[button 3](buttonurl://example.com)</code>
  This will show button 1 and 2 on the same line, with 3 underneath.

filling_help: |
  <b>Fillings</b>
  You can also customise the contents of your message with contextual data. For example, you could mention a user by name in the welcome message, or mention them in a filter!
  You can use these to mention a user in notes too!
  <b>Supported fillings:</b>
  - <code>{first}</code>: The user's first name.
  - <code>{last}</code>: The user's last name.
  - <code>{fullname}</code>: The user's full name.
  - <code>{username}</code>: The user's username. If they don't have one, mentions the user instead.
  - <code>{mention}</code>: Mentions the user with their firstname.
  - <code>{id}</code>: The user's ID.
  - <code>{chatname}</code>: The chat's name.
  - <code>{admin}</code>: Note-Filter can only be used by chat admins (not for non-admins)
  - <code>{user}</code>: Note-Filter can only be used by chat users (not for admins)
  - <code>{preview}</code>: show webpage preview for links in notes (defaults to false)
  - <code>{protect}</code>: protect the note contect from being shared (defaults to false)

gtranslate_help: |
  Use this module to translate stuff... duh!

  *Commands:*
  • `/tl` (or `/tr`): as a reply to a message, translates it to English.
  • `/tl <lang>`: translates to <lang>
    eg: `/tl ja`: translates to Japanese.
  • `/tl <source>//<dest>`: translates from <source> to <lang>.
    eg: `/tl ja//en`: translates from Japanese to English.
  • `/langs`: get a list of supported languages for translation.

  "" = Not used when replied to a message.

locks_help: |
  Locks allows you to lock away some common items in the
  telegram world; the bot will automatically delete them!

  • `/locktypes`*:* lists all possible locktypes

  *admins only:*
  • `/lock <type>`*:* lock items of a certain type (not available in private)
  • `/unlock <type>`*:* unlock items of a certain type (not available in private)
  • `/locks`*:* the current list of locks in this chat.
  • `/antichannel <on/off>`*:* bans and deletes anyone who tries to talk as channel.

  locking bots will stop non-admins from adding bots to the chat.

  *note:*
  • unlocking permission *info* will allow members (non-admins) to change the group information, such as the description or the group name
  • unlocking permission *pin* will allow members (non-admins) to pin a message in the group

log_help: |
  *admins only:*
  • `/logchannel`*:* get log channel info
  • `/setlog`*:* set the log channel.
  • `/unsetlog`*:* unset the log channel.

  • `/logsettings`*:* specify what to log to the log channel.

  • `/announce <on/off/yes/no/true/false>`*:* toggle setting to announce admin actions in chatroom.
  announce is a module that keeps u updated with admin actions in your group weather its done manually or by other bots. turn it on to get announcements on every admin action in your group. note that no matter if this is on or off everythong will be logged to the log channel.

  setting the log channel is done by:
  • adding the bot to the desired channel (as an admin!)
  • sending `/setlog` in the channel
  • forwarding the `/setlog` to the group

markdown_help_text: |
  Markdown is a very powerful formatting tool supported by telegram. I have some enhancements, to make sure that
  saved messages are correctly parsed, and to allow you to create buttons.

  - <code>_italic_</code>: wrapping text with '_' will produce italic text
  - <code>*bold*</code>: wrapping text with '*' will produce bold text
  - <code>~strikethrough~</code>: Tildes are used for strikethrough. Shows as: <strike>strikethrough</strike>.
  - <code>`code`</code>: wrapping text with '`' will produce monospaced text, also known as 'code'
  - <code>__underline__</code>: Double underscores are used for underline. Shows as: <u>underline</u>.
  - <code>||spoiler||</code>: Double vertical lines are used for spoilers. Shows as: <tg-spoiler>spoiler</tg-spoiler>.
  - <code>[sometext](someURL)</code>: this will create a link - the message will just show <code>sometext</code>,
  and tapping on it will open the page at <code>someURL</code>.
  EG: <code>[test](example.com)</code>

  - <code>[buttontext](buttonurl:someURL)</code>: this is a special enhancement to allow users to have telegram
  buttons in their markdown. <code>buttontext</code> will be what is displayed on the button, and <code>someurl</code>
  will be the url which is opened.
  EG: <code>[This is a button](buttonurl:example.com)</code>

  If you want multiple buttons on the same line, use :same, as such:
  <code>[one](buttonurl://example.com)
  [two](buttonurl://google.com:same)</code>
  This will create two buttons on a single line, instead of one button per line.

misc_help: |
  - /id: get the current group id. If used by replying to a message, gets that user's id.
  - /gifid: reply to a gif to me to tell you its file ID.
  - /info: get information about a user.
  - /u: get information about a user.
  - /whois: get short information about a user.
  - /pfp: get profile pic of a user.
  - /markdownhelp: quick summary of how markdown works in telegram - can only be called in private chats.
  - /ud <word>: Type the word or expression you want to search use.
  - /urban <word>: Same as /ud
  - /paste - Do a paste at `nekobin.com`
  - /react: Reacts with a random reaction
  - /weebify <text>: returns a weebified text
  - /tr (language code) as reply to a long message.
  - /time <query> : Gives information about a timezone.
  - /cash : currency converter
    example syntax: /cash 1 USD INR
  - /getid : get IDs of chat, user and chat message.
  - /tts : converts the sent text or replied to message to audio.
  - /weather <loaction>: Gets the weather of the location
  - /runs: reply a random string from an array of replies.
  - /pat: pat a person, cool thing to have for cute ones :3
  - /slap: slap a user, or get slapped if not a reply.
  - /shrug : get shrug XD.
  - /table : get flip/unflip :v.
  - /decide : Randomly answers yes/no/maybe
  - /toss : Tosses A coin
  - /roll : Roll a dice.
  - /rlg : Join ears,nose,mouth and create an emo ;-;
  - /shout <keyword>: write anything you want to give loud shout.
  - /stickerid: reply to a sticker to get its ID.
  - /getsticker: reply to a sticker to get the raw PNG image.
  - /steal: reply to a sticker or image to add it to your pack.
  - /afk <reason>: mark yourself as AFK(away from keyboard).
  - brb <reason>: same as the afk command - but not a command.
  When marked as AFK, any mentions will be replied to with a message to say you're not available!

muting_help: |
  *admins only:*
  - `/mute <userhandle>`*:* silences a user. can also be used as a reply, muting the replied to user.
  - `/dmute <userhandle>`*:* silences a user. silently.
  - `/smute <userhandle>`*:* silences a user. deleting the replied to message.
  - `/dsmute <userhandle>`*:* silences a user. deleting the sent and replied to message.
  - `/tmute <userhandle> x(m/h/d)`*:* mutes a user for x time. (via handle, or reply). `m` = `minutes`, `h` = `hours`, `d` = `days`.
  - `/unmute <userhandle>`*:* unmutes a user. can also be used as a reply, muting the replied to user.

notes_help: |
  - `/get <notename>`*:* get the note with this notename
  - `#<notename>`*:* same as /get
  - `/notes` or `/saved`*:* list all saved notes in this chat
  - `/<number>`*:* will pull the note of that number in the list.

  if you would like to retrieve the contents of a note without any formatting, use 
  `/get <notename> noformat or raw`, or use `#notename noformat or raw`. 
  this can be useful when updating a current note.

  *admins only:*
  - `/save <notename> <notedata>`*:* saves notedata as a note with name notename
  a button can be added to a note by using standard markdown link syntax - the link should just be prepended with a
  `buttonurl:` section, as such: `[somelink](buttonurl:example.com)`. check `/markdownhelp` for more info.
  - `/save <notename>`*:* save the replied message as a note with name notename
  - `/clear <notename>`*:* clear note with this name

  *owner only:*
  - `/removeallnotes`*:* removes all notes from the group
  - `/clearall`*:* removes all notes from the group

  *Note:* Note names are case-insensitive, and they are automatically converted to lowercase before getting saved.

purge_help: |
  *admin only:*
  - `/del`, `/d`, `/delete`: deletes the message you replied to
  - `/purge`, `/p`: deletes all messages between this and the replied to message.
  - `/purge <int X>`, `/p <int X>`: deletes the replied message, and X messages following it if replied to a message.

reports_help: |
  - `/report <reason>`*:* reply to a message to report it to admins.
  - `@admin`*:* reply to a message to report it to admins.
  *note:* neither will trigger if used by admins.

  *admins only:*
  - `/reports <on/off>`*:* change report setting, or view current status.
    if done in pm, toggles your status.
    if in group, toggles that groups's status.

rules_help: |
  - `/rules`*:* get the rules for this chat.
  *admins only:*
  - `/setrules <your rules here>`*:* set the rules for this chat.
  - `/clearrules`*:* clear the rules for this chat.

warns_help: |
  - `/warns <userhandle>`*:* get a user's number, and reason, of warns.
  - `/warnlist`*:* list of all current warning filters
  - `/warnfilters`*:* list of all current warning filters

  *admins only:*
  - `/warn <userhandle>`*:* warn a user. after 3 warns, the user will be banned from the group. can also be used as a reply.
  - `/swarn <userhandle>`*:* same as `/warn` but warns the user silently.
  - `/dwarn <userhandle>`*:* same as `/warn` but deletes the replied to message.
  - `/dswarn <userhandle>`*:* same as `/warn` but deletes the sent and replied to message.
  - `/resetwarn <userhandle>`*:* reset the warns for a user. can also be used as a reply.
  - `/resetwarns <userhandle>`*:* reset the warns for a user. can also be used as a reply.
  - `/addwarn <keyword> <reply message>`*:* set a warning filter on a certain keyword. if you want your keyword to
  be a sentence, encompass it with quotes, as such: `/addwarn "very angry" this is an angry user`.
  - `/nowarn <keyword>`*:* stop a warning filter
  - `/stopwarn <keyword>`*:* stop a warning filter
  - `/warnlimit <num>`*:* set the warning limit
  - `/strongwarn <on/yes/off/no>`*:* if set to on, exceeding the warn limit will result in a ban. else, will just kick.

greetings_help: |
  *admins only:*
  - `/welcome <on/off>`*:* enable/disable welcome messages.
  - `/welcome`*:* shows current welcome settings.
  - `/welcome noformat`*:* shows current welcome settings, without the formatting - useful to recycle your welcome messages!
  - `/goodbye`*:* same usage and args as `/welcome`.
  - `/setwelcome <sometext>`*:* set a custom welcome message. if used replying to media, uses that media.
  - `/setgoodbye <sometext>`*:* set a custom goodbye message. if used replying to media, uses that media.
  - `/resetwelcome`*:* reset to the default welcome message.
  - `/resetgoodbye`*:* reset to the default goodbye message.
  - `/cleanwelcome <on/off>`*:* on new member or after 5 minutes, try to delete the previous welcome message to avoid spamming the chat.
  - `/cleanservice <on/off`*:* deletes telegrams welcome/left service messages.
  *example:*
  user joined chat, user left chat.

nation_help: |
  Some users have access levels we call as *Super Users*
  They are users with special bot priveleges and have commands that can only be used by them.
  *God* - Only one exists, bot owner.
  Owner has complete bot access, including bot adminship in chats this bot is at.
  *Devs* - Devs who can access the bots server and can execute, edit, modify bot code. Can manage other Nations
  *SUDOS* - Have super user access to the bot.
  *Support* - Have access to globally ban users across the bot.
  *Whitelist* - Cannot be banned, muted flood kicked but can be manually banned by admins and can unban themselves if banned.
  *Moderators* - They have some admin permissions, and cannot be banned, muted flood kicked but can be manually banned by admins.
  *Disclaimer*: The Super Users in the bot are there for troubleshooting, support, banning potential scammers.

  Report abuse or ask us more on these at the Support chat.
  You can visit @asanotanchb_support to query more about these.

stickers_help: |
  - `/stickerid`*:* gets the id of the replied sticker.
  - `/getsticker`*:* get the replied sticker in an image format.
  - `/kang`*:* add the replied sticker to your pack.
  - `/steal`*:* add the replied sticker to your pack.

github_help: |
  Fetches GitHub releases.
  *available commands:*
  - `/git <user>/<repo>`: fetch the most recent release from that repo.
  - `/git <user>/<repo> <number>`: fetch releases in the past.
  - `/fetch <reponame> or &reponame`: same as `/git`, but you can use a saved repo shortcut
  - `/gitver`: returns the current API version
  - `/changelog <reponame>`: gets the changelog of a saved repo shortcut

pins_help: |
  *admins only:*
  - `/pin`*:* silently pins the message replied to ; add `'loud'` or `'notify'` to give notifs to users.
  - `/unpin`*:* unpins the currently pinned message
  - `/permapin`*:* pins a message though the bot permanently, this message can include buttons, markdown, etc 

  *creator only:*
  - `/unpinall`*:* unpins all pinned messages in a chat.

  if you want to use these functions make sure to pin and unpin the messages with the bot and not manually

  *anti channel pins*
  *available commands:*
  - /cleanlinked <on/off>: automatically delete linked channel posts from chatroom
  - /antichannelpin <on/off>: automatically unpins linked channel posts from chatroom

welcome_mutes: |
  The following options are possible:
  - <code>/welcomemute soft</code><b>:</b> restricts new members from sending media for 24 hours.
  - <code>/welcomemute strong</code><b>:</b> mutes new members till they tap on a button thereby verifying they're human.
  - <code>/welcomemute captcha</code><b>:</b>  mutes new members till they solve a button captcha thereby verifying they're human.
  - <code>/welcomemute off</code><b>:</b> turns off welcomemute.
  <b>Note:</b> Strong mode kicks a user from the chat if they dont verify in 120seconds. They can always rejoin though

welcome_help: |
  thy group's welcome/goodbye messages can be personalised in multiple ways. if you want the messages
  to be individually generated, like the default welcome message is, you can use *these* variables:
  - <code>{first}</code><b>:</b> this represents the user's *first* name
  - <code>{last}</code><b>:</b> this represents the user's *last* name. defaults to *first name* if user has no 
  last name.
  - <code>{fullname}</code><b>:</b> this represents the user's *full* name. defaults to *first name* if user has no 
  last name.
  - <code>{username}</code><b>:</b> this represents the user's *username*. defaults to a *mention* of the user's 
  first name if has no username.
  - <code>{mention}</code><b>:</b> this simply *mentions* a user - tagging them with their first name.
  - <code>{id}</code><b>:</b> this represents the user's *id*
  - <code>{count}</code><b>:</b> this represents the user's *member number*.
  - <code>{chatname}</code><b>:</b> this represents the *current chat name*.
  each variable MUST be surrounded by <code>{}</code> to be replaced.
  welcome messages also support markdown, so you can make any elements bold/italic/code/links. 
  buttons are also supported, so you can make your welcomes look awesome with some nice intro buttons.
  To create a button linking to your rules, use this: <code>[Rules](buttonurl://t.me/{dispatcher.bot.username}?start=group_id)</code>. 
  Simply replace <code>group_id</code> with your group's id, which can be obtained via /id, and you're good to 
  go. Note that group ids are usually preceded by a <code>-</code> sign; this is required, so please don't 
  remove it.
  You can even set images/gifs/videos/voice messages as the welcome message by 
  replying to the desired media, and calling <code>/setwelcome</code>.

sticker_blacklist_help: |
  **admin commanss:**
  - `/addblsticker <sticker link>**`:** add the sticker trigger to the black list. can be added via reply sticker
  - `/unblsticker <sticker link>**`:** remove triggers from blacklist. the same newline logic applies here, so you can delete multiple triggers at once
  - `/rmblsticker <sticker link>**`:** same as above
  - `/blstickermode <delete/ban/tban/mute/tmute>**`:** sets up a default action on what to do if users use blacklisted stickers
  note:
  - `<sticker link>` can be `https://t.me/addstickers/<sticker>` or just `<sticker>` or reply to the sticker message

raid_help: |
  *admins only!* 

  - /raid `(off/time optional)` : toggle the raid mode (on/off)
  if no time is given it will default to 2 hours then turn off automatically
  by enabling *raid mode* i will kick every user on joining the group.

  - /raidtime `(time optional)` : view or set the default duration for raid mode, after that time from toggling the raid mode will turn off automatically
  default is 6 hours

  - /raidactiontime `(time optional)` : view or set the default duration that the raid mode will tempban
  default is 1 hour
